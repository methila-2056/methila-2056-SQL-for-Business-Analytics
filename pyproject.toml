[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sql-business-analytics"
version = "1.0.0"
description = "SQL-based Business Analytics project for telecom customer churn analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Methila", email = "methilashiv@gmail.com"}
]
keywords = ["sql", "analytics", "business-intelligence", "churn-analysis", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5.0",
]

[project.urls]
Repository = "https://github.com/methila-2056/methila-2056-SQL-for-Business-Analytics"

[project.scripts]
sql-analytics = "SQL_Analytics.sql_analysis:main"

[tool.setuptools]
py-modules = []
